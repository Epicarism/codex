packages:
  - codex-cli
  - codex-rs/responses-api-proxy/npm
  - sdk/typescript

ignoredBuiltDependencies:
  - esbuild

minimumReleaseAge: 10080
minimumReleaseAgeExclude:
  # Security fixes younger than the 7-day release-age rule (2026-10-26):
  # undici GHSA-xjj6-f33q-929c, body-parser GHSA-27r3-jxmh-p828, zod GHSA-mrhx-c7xc-m3w5
  - undici@7.30.1
  - body-parser@2.4.0
  - zod@4.6.7

blockExoticSubdeps: true
strictDepBuilds: true
trustPolicy: no-downgrade
trustPolicyIgnoreAfter: 10080
trustPolicyExclude: []
allowBuilds:
  # Build only the official MCP conformance CLI pinned by the TypeScript SDK.
  "@modelcontextprotocol/conformance@https://codeload.github.com/modelcontextprotocol/conformance/tar.gz/49103de6ed70804e940637bf3e9e29e4a3f54e64": true
